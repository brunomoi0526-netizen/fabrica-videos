name: Fabrica de videos

on:
  push:
    branches: [main]
    paths: ["guiones/**.json", "fabrica.py", "config.json"]
  workflow_dispatch:
    inputs:
      rehacer:
        description: "ID del guion a rehacer (opcional, ej. 002_titanic)"
        required: false
        default: ""

concurrency:
  group: fabrica
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt

      - name: Crear videos pendientes
        env:
          GH_TOKEN: ${{ github.token }}
          REHACER: ${{ github.event.inputs.rehacer }}
        run: bash scripts/crear_pendientes.sh
